[project]
name = "emusort"
dynamic = ["version"]
description = "A command line tool for high performance spike sorting of multichannel, single unit electromyography"
requires-python = ">=3.10,<=3.12" # python version constrained by spikeinterface, joblib, and Phy GUI requirements.
authors = [
    { name = "Sean O'Connell", email = "smarkoco@proton.me" },
    { name = "Jonathan A Michaels", email = "jmichae@yorku.ca" },
]
license = { file = "LICENSE" }
readme = "README.md"

[project.urls]
Homepage = "https://github.com/snel-repo/EMUsort"

[project.scripts]
emusort = "emusort.emusort:main" # Entry point for command-line interface

[build-system]
requires = [
    "hatchling",
    "uv-dynamic-versioning",
    "wheel",
    ]
build-backend = "hatchling.build"

[project.optional-dependencies]
## Below are different extras used to specify desired packages during installation.
# use "full" to install all packages necessary for optimal performance and visualization with Phy
full = [
    "joblib == 1.4.2",
    "kilosort == 4.0.18",
    "numcodecs < 0.16.0",
    "numpy >= 1.20",
    "scikit-learn >= 1.3",
    "setuptools >= 42, <81",
    "spikeinterface[full] == 0.104.7",
    "matplotlib",
    "pandas",
    "ruamel.yaml",
    "torch >= 2.4.0",
    "torchaudio >= 2.4.0",
    # "phy",
    # "pyqt5; sys_platform=='win32'",
    # "pyqt5 >= 5.15.9; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqt5-qt5 > 5.15.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqt5-sip; sys_platform=='win32'",
    # "pyqt5-sip >= 12.12.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqtgraph",
    # "pyqtwebengine < 5.15.2; sys_platform=='win32'",
    # "pyqtwebengine > 5.15.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "qtpy >= 2.4.1; sys_platform=='linux' or sys_platform=='darwin'",
    # "qtpy; sys_platform=='win32'",
    "pyqtgraph >= 0.13.0",
    "pyqt5 == 5.15.11",
    "pyqt5-qt5 == 5.15.2",
    "pyqt5-sip == 12.18.0",
    "qtconsole == 5.7.2",
    "qtpy >= 2",
    "pyqtwebengine==5.15.7",
    "pyqtwebengine-qt5==5.15.2",
    "phy@git+https://github.com/cortex-lab/phy@0eb09d1",

]
# use "core" for a minimal install of emusort dependencies without pytorch
# you will also need "cpu" or "cu118", for example, running: uv sync --extra core --extra cu118
core = [
    "joblib == 1.4.2",
    "kilosort == 4.0.18",
    "numcodecs < 0.16.0",
    "numpy >= 1.20",
    "scikit-learn >= 1.3",
    "setuptools >= 42, <81",
    "spikeinterface[full] == 0.104.7",
    "matplotlib",
    "pandas",
    "ruamel.yaml",
]
# if using the "core" extra, install the cpu version of pytorch
cpu = [
    "torch >= 2.4.0",
    "torchaudio >= 2.4.0",
]
# if using the "core" extra, install the gpu version of pytorch
cu118 = [
    "torch >= 2.4.0",
    "torchaudio >= 2.4.0",
]
# if using the "core" extra, install Phy for visualization
# the equivalent command to "uv sync --extra full" is "uv sync --extra core --extra cu118 --extra phy"
phy = [
    # "phy",
    # "pyqt5; sys_platform=='win32'",
    # "pyqt5 >= 5.15.9; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqt5-qt5 <= 5.15.2; sys_platform=='win32'",
    # "pyqt5-qt5 > 5.15.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqt5-sip; sys_platform=='win32'",
    # "pyqt5-sip >= 12.12.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqtgraph",
    # "pyqtwebengine < 5.15.2; sys_platform=='win32'",
    # "pyqtwebengine > 5.15.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "qtpy >= 2.4.1; sys_platform=='linux' or sys_platform=='darwin'",
    # "qtpy; sys_platform=='win32'",
    "pyqtgraph >= 0.13.0",
    "pyqt5 == 5.15.11",
    "pyqt5-qt5 == 5.15.2",
    "pyqt5-sip == 12.18.0",
    "qtconsole == 5.7.2",
    "qtpy >= 2",
    "pyqtwebengine==5.15.7",
    "pyqtwebengine-qt5==5.15.2",
    "phy@git+https://github.com/cortex-lab/phy@0eb09d1",

]

# [tool.setuptools.dynamic]
# version = {attr = "emusort.__version__"}
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu118" },
    ],
    [
        {extra = "full"},
        {extra = "core"},
    ],
    [
        {extra = "full"},
        {extra = "phy"},
    ],
    [
        {extra = "full"},
        {extra = "cu118"},
    ],
    [
        {extra = "full"},
        {extra = "cpu"},
    ],
]
constraint-dependencies = [
    "joblib == 1.4.2",
    "kilosort == 4.0.18",
    "numcodecs < 0.16.0",
    "numpy >= 1.20",
    "scikit-learn >= 1.3",
    "setuptools >= 42, <81",
    "spikeinterface[full] == 0.104.7",
    "torch >= 2.4.0",
    "torchaudio >= 2.4.0",
    # "pyqt5-qt5 < 5.15.19; sys_platform=='win32'",
    # "pyqt5-qt5 > 5.15.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqt5 >= 5.15.9; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqt5-sip >= 12.12.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "pyqtwebengine < 5.15.2; sys_platform=='win32'",
    # "pyqtwebengine > 5.15.2; sys_platform=='linux' or sys_platform=='darwin'",
    # "qtpy >= 2.4.1; sys_platform=='linux' or sys_platform=='darwin'",
    "pyqtgraph >= 0.13.0",
    "pyqt5 == 5.15.11",
    "pyqt5-qt5 == 5.15.2",
    "pyqt5-sip == 12.18.0",
    "qtconsole == 5.7.2",
    "qtpy >= 2",
    "pyqtwebengine==5.15.7",
    "pyqtwebengine-qt5==5.15.2",
    "phy@git+https://github.com/cortex-lab/phy@0eb09d1",

]

[tool.uv.sources]
#phy = [
#    {git = "https://github.com/cortex-lab/phy.git", rev = "7a2494b"} # Phy GUI
#]

# Specify CPU/CUDA version for download. Also enable "full" flag to get CUDA
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118"},
    { index = "pytorch-cu118-full", extra = "full"},
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118"},
    { index = "pytorch-cu118-full", extra = "full"},
]
    
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118-full"
url = "https://download.pytorch.org/whl/cu118"
explicit = true