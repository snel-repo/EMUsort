name: Publish Python distribution to PyPI and TestPyPI

on:
  push:
    branches:
      - v1.1.0

jobs:
  build:
    name: Build distribution
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, windows-2019, windows-2022, windows-2025]
        python-version: ["3.10","3.11"] # ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v5
      with:
        name: python-package-distributions-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/

  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # [ubuntu-20.04, ubuntu-22.04, ubuntu-24.04, windows-2019, windows-2022, windows-2025]
        python-version: ["3.10","3.11"] # ["3.10", "3.11", "3.12"]
    needs:
    - build
    runs-on: ${{ matrix.os }}

    environment:
      name: testpypi
      url: https://test.pypi.org/p/emusort

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

