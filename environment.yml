---
# this environment was tested with a remote Linux system with an X11 graphical windowing system
name: emusort
channels:
  - conda-forge
  - pytorch
dependencies:
  - cudatoolkit
  - cxx-compiler
  - cython
  - h5py
  - hatch
  - hatch-build
  - hdbscan
  - ipympl
  - ipywidgets
  - joblib=1.4.2
  - jupyter
  - libxcb
  - loky
  - matplotlib
  - networkx
  - numba
  - numcodecs<0.16.0 # thanks to Josh Posen for this suggestion to resolve a conflict
  - numpy<2.0
  - pandas
  - pip
  - pybind11
  - pyqt=5
  - pyqt5-sip
  - pyqtgraph
  - pyqtwebengine
  - python>3.9,<3.12 # phy gui makes py311 the maximum, due to imp dependency
  - pytorch-gpu
  - ruamel.yaml
  - scikit-learn>1.3.2
  - scipy
  - setuptools<81
  - torchaudio
  - torchvision
  - tqdm
  - uv
  - xarray
  - zarr
  - pip:
        - kilosort==4.0.18 # custom spikeinterface class later modifies kilosort for EMUsort
        - spikeinterface[full]==0.104.7
        - git+https://github.com/cortex-lab/phy.git@7a2494b # latest working version of phy from GitHub
        - "-e ." # finally install EMUsort locally
